name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Quartz generally works fine on LTS; use 20 unless you *need* 22
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npm run quartz build
        # Ensure this outputs the static site to ./public

      # ⬇️ This is the key: upload a **Pages artifact**
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public            # your built site folder
          # name defaults to "github-pages" which is what deploy-pages expects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ⬇️ No download/extract needed. Deploy reads the Pages artifact automatically.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # optional tuning:
          timeout: 1200000           # 20 min
          error_count: 20
          reporting_interval: 5000
